spring:
  application:
    name: analyzer

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:postgresql://localhost:5432/analyzer
    username: analyzer
    password: analyzer

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always

server:
  port: 0

analyzer:
  kafka:
    bootstrap-servers: localhost:9092
    topic:
      snapshots: telemetry.snapshots.v1
      hubs: telemetry.hubs.v1
    consumer:
      snapshots:
        group-id: analyzer-snapshots
      hubs:
        group-id: analyzer-hubs

grpc:
  client:
    hub-router:
      address: static://localhost:59090
      negotiationType: plaintext

eureka:
  client:
    enabled: false