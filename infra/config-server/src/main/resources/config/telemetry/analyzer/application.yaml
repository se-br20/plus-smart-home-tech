analyzer:
  kafka:
    bootstrap-servers: localhost:9092

    topic:
      snapshots: telemetry.snapshots.v1
      hubs: telemetry.hubs.v1

    consumer:
      snapshots:
        group-id: analyzer-snapshots
      hubs:
        group-id: analyzer-hubs

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/analyzer
    username: analyzer
    password: analyzer

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always

grpc:
  client:
    hub-router:
      address: discovery:///hub-router
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext